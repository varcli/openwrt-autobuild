name: build-x86-64

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      rootfs_partsize:
        description: "请输入要编译固件大小 单位(MB)"
        required: false
        default: "1024"
      include_docker:
        description: "是否编译 Docker 插件"
        required: true
        default: "no"
        type: choice
        options:
          - "yes"
          - "no"
permissions:
  contents: write
  actions: write

concurrency:
  group: build-x86-64
  cancel-in-progress: false

env:
  BUILD_ID: ${{ github.run_id }}.${{ github.run_attempt }}
  BUILD_COMMIT: ${{ github.sha }}
  UPDATE_REPOSITORY: ${{ github.repository }}
  TZ: Asia/Shanghai
  ROOTFS_PARTSIZE: ${{ inputs.rootfs_partsize || '1024' }}
  INCLUDE_DOCKER: ${{ inputs.include_docker || 'no' }}
  ImageBuilderVersion: x86-64-openwrt-25.12.2 # 详见https://hub.docker.com/r/immortalwrt/imagebuilder

jobs:
  build:
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        target: [x86-64]

    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 准备构建标识
        run: |
          echo "RELEASE_TAG=x86-64-$(date +'%Y.%m.%d-%H%M')-$BUILD_ID" >> "$GITHUB_ENV"

      - name: 加载自定义配置
        run: |
          chmod +x ${{ github.workspace }}/${{ matrix.target }}/build.sh

      - name: 编译固件
        id: compile
        run: |
          docker run --rm -i \
            --user root \
            -v "${{ github.workspace }}/bin:/home/build/immortalwrt/bin" \
            -v "${{ github.workspace }}/files:/home/build/immortalwrt/files" \
            -v "${{ github.workspace }}/${{ matrix.target }}/.config:/home/build/immortalwrt/.config" \
            -v "${{ github.workspace }}/shell:/home/build/immortalwrt/shell" \
            -v "${{ github.workspace }}/packages:/home/build/immortalwrt/package-sources:ro" \
            -v "${{ github.workspace }}/${{ matrix.target }}/build.sh:/home/build/immortalwrt/build.sh" \
            -e ROOTFS_PARTSIZE \
            -e INCLUDE_DOCKER \
            -e PROFILE=generic \
            -e BUILD_ID \
            -e BUILD_COMMIT \
            -e UPDATE_REPOSITORY \
            immortalwrt/imagebuilder:${{ env.ImageBuilderVersion }} /bin/bash /home/build/immortalwrt/build.sh

          echo "COMPILESTATUS=success" >> $GITHUB_ENV

      - name: 整理文件
        id: files
        if: env.COMPILESTATUS == 'success' && success()
        run: |
          ls -l ${{ github.workspace }}/bin/targets/x86/64/
          mkdir -p ${{ github.workspace }}/dist
          cp ${{ github.workspace }}/bin/targets/x86/64/** ${{ github.workspace }}/dist
          rm -rf ${{ github.workspace }}/dist/*-kernel.bin
          rm -rf ${{ github.workspace }}/dist/*.manifest
          rm -rf ${{ github.workspace }}/dist/*.json
          rm -rf ${{ github.workspace }}/dist/sha256sums
          find "${{ github.workspace }}/dist" -maxdepth 1 -type f -name '*-squashfs-combined-efi.img.gz' -size +0c -print -quit | grep -q .
          ls -l ${{ github.workspace }}/dist

      - name: 生成固件更新清单
        if: env.COMPILESTATUS == 'success' && success()
        run: python3 shell/firmware-update.py manifest dist

      - name: 生成release信息
        id: release_info
        if: env.COMPILESTATUS == 'success' && success()
        run: |
          touch release.txt
          echo "${{ matrix.target }} 固件" >> release.txt
          if [ "$INCLUDE_DOCKER" = "yes" ]; then
            echo "带docker功能" >> release.txt
          fi
          echo "账户：root" >> release.txt
          echo "密码：无" >> release.txt
          echo "单网口旁路由默认地址：http://192.168.123.2" >> release.txt
          echo "DHCPv4、DHCPv6、IPv6 RA 和 NDP 服务默认关闭，DNS 服务保留。" >> release.txt
          echo "客户端使用同网段地址，手动设置网关为 192.168.123.2；需要 DNS 经旁路由处理时，DNS 也设为 192.168.123.2。" >> release.txt
          echo "主路由默认地址为 192.168.123.1；保留配置升级时可能沿用旧设置。" >> release.txt

      - name: 发布固件
        id: release
        if: env.COMPILESTATUS == 'success' && success()
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.RELEASE_TAG }}
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          body_path: release.txt
          fail_on_unmatched_files: true
          files: |
            ${{ github.workspace }}/dist/**
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 清理Workflow
        if: env.COMPILESTATUS == 'success' && success()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          retain_days: 1
          keep_minimum_runs: 0
