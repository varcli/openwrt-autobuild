name: build-phicomm-n1

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      rootfs_partsize:
        description: "请输入要编译固件大小 单位(MB)"
        required: false
        default: "1024"
      include_docker:
        description: "是否编译 Docker 插件"
        required: true
        default: "yes"
        type: choice
        options:
          - "yes"
          - "no"
      openwrt_kernel:
        description: "选择构建的内核(斐讯N1) 参考 https://github.com/breakingbadboy/OpenWrt/releases"
        required: false
        default: "6.1.y_6.6.y"
        type: choice
        options:
          - "6.1.y_6.6.y_6.12.y"
          - "6.1.y_6.6.y"
          - "6.6.y_6.12.y"
          - "5.4.y"
          - "5.10.y"
          - "5.15.y"
          - "6.1.y"
          - "6.6.y"
          - "6.12.y"
permissions:
  contents: write
  actions: write

concurrency:
  group: build-phicomm-n1
  cancel-in-progress: false

env:
  UPDATE_REPOSITORY: ${{ github.repository }}
  TZ: Asia/Shanghai
  OPENWRT_KERNEL: ${{ inputs.openwrt_kernel || '6.1.y_6.6.y' }}
  ROOTFS_PARTSIZE: ${{ inputs.rootfs_partsize || '1024' }}
  INCLUDE_DOCKER: ${{ inputs.include_docker || 'yes' }}
  ImageBuilderVersion: armsr-armv8-openwrt-24.10.6 # 详见https://hub.docker.com/r/immortalwrt/imagebuilder

jobs:
  build:
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        target: [phicomm-n1]

    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 准备发版标识
        run: |
          echo "RELEASE_TAG=phicomm-n1-$(date +'%Y.%m.%d-%H%M')-${{ github.run_id }}.${{ github.run_attempt }}" >> "$GITHUB_ENV"

      - name: 加载自定义配置
        run: |
          chmod +x ${{ github.workspace }}/${{ matrix.target }}/build.sh

      - name: 编译固件
        id: compile
        run: |
          docker run --rm -i \
            --user root \
            -v "${{ github.workspace }}/bin:/home/build/immortalwrt/bin" \
            -v "${{ github.workspace }}/files:/home/build/immortalwrt/files" \
            -v "${{ github.workspace }}/${{ matrix.target }}/.config:/home/build/immortalwrt/.config" \
            -v "${{ github.workspace }}/shell:/home/build/immortalwrt/shell" \
            -v "${{ github.workspace }}/${{ matrix.target }}/build.sh:/home/build/immortalwrt/build.sh" \
            -e ROOTFS_PARTSIZE \
            -e INCLUDE_DOCKER \
            -e PROFILE=generic \
            -e UPDATE_REPOSITORY \
            immortalwrt/imagebuilder:${{ env.ImageBuilderVersion }} /bin/bash /home/build/immortalwrt/build.sh

          echo "COMPILESTATUS=success" >> $GITHUB_ENV

      - name: 查找 rootfs.tar.gz 所在路径
        id: find_rootfs
        run: |
          ROOTFS_FILE=$(find bin/targets/*/*/ -type f -name "*rootfs.tar.gz" | head -n1)
          echo "✅ Found: $ROOTFS_FILE"
          if [ ! -f "$ROOTFS_FILE" ]; then
            echo "❌ 找不到 rootfs.tar.gz 文件"
            exit 1
          fi
          echo "file=$ROOTFS_FILE" >> $GITHUB_OUTPUT

      - name: 打包 Armvirt as ImmortalWrt for N1
        uses: ophub/flippy-openwrt-actions@main
        if: env.COMPILESTATUS == 'success' && success()
        env:
          OPENWRT_ARMSR: ${{ steps.find_rootfs.outputs.file }}
          PACKAGE_SOC: s905d
          KERNEL_VERSION_NAME: ${{ env.OPENWRT_KERNEL }}
          KERNEL_AUTO_LATEST: true
          WHOAMI: varcli
          GZIP_IMGS: gz
          SAVE_OPENWRT_ROOTFS: false

      - name: 整理文件
        id: files
        if: env.COMPILESTATUS == 'success' && success()
        run: |
          if [ "$PACKAGED_STATUS" != "success" ]; then
            echo "错误：N1 固件打包未成功"
            exit 1
          fi
          test -n "$PACKAGED_OUTPUTPATH"
          test -d "$PACKAGED_OUTPUTPATH"
          python3 shell/prepare-n1-release.py "$PACKAGED_OUTPUTPATH" dist
          echo "ready=true" >> "$GITHUB_OUTPUT"
          ls -l ${{ github.workspace }}/dist

      - name: 生成release信息
        id: release_info
        if: env.PACKAGED_STATUS == 'success' && steps.files.outputs.ready == 'true' && success()
        run: |
          touch release.txt
          echo "${{ matrix.target }} 固件" >> release.txt
          echo "内核版本 $OPENWRT_KERNEL" >> release.txt
          if [ "$INCLUDE_DOCKER" = "yes" ]; then
            echo "带docker功能" >> release.txt
          fi
          echo "账户：root" >> release.txt
          echo "密码：无" >> release.txt
          echo "晶晨宝盒更新仓库：https://github.com/$UPDATE_REPOSITORY" >> release.txt
          echo "Tags 关键字：phicomm-n1；固件后缀：.img.gz。" >> release.txt
          echo "完整更新按插件设置的内核分支匹配；本次打包内核分支为 $OPENWRT_KERNEL。" >> release.txt
          echo "单网口旁路由默认地址：http://192.168.123.2" >> release.txt
          echo "DHCPv4、DHCPv6、IPv6 RA 和 NDP 服务默认关闭，DNS 服务保留。" >> release.txt
          echo "客户端使用同网段地址，手动设置网关为 192.168.123.2；需要 DNS 经旁路由处理时，DNS 也设为 192.168.123.2。" >> release.txt
          echo "主路由默认地址为 192.168.123.1；保留配置升级时可能沿用旧设置。" >> release.txt

      - name: 发布固件
        id: release
        if: env.PACKAGED_STATUS == 'success' && steps.files.outputs.ready == 'true' && success()
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.RELEASE_TAG }}
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          body_path: release.txt
          fail_on_unmatched_files: true
          files: |
            ${{ github.workspace }}/dist/**
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 清理Workflow
        if: env.PACKAGED_STATUS == 'success' && steps.files.outputs.ready == 'true' && success()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          retain_days: 7
          keep_minimum_runs: 3
